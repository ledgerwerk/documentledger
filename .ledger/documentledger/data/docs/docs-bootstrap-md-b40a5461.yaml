    summary: Bootstrapping a new repository
    text: "# Bootstrapping a new repository


      Documentledger computes staleness from explicit doc-to-source links. A freshly
      initialized repository has no links yet, so the first scan reports no stale docs
      even though no documentation exists. This page describes the recommended setup
      sequence for first-time documentation work."
    links: []
  - section_id: md:section:docs/bootstrap.md::setup-sequence
    doc_path: docs/bootstrap.md
    heading_path:
      - Bootstrapping a new repository
      - Setup sequence
    heading_slug: setup-sequence
    line_span:
      - 9
      - 48
    section_hash: 179540f19a685d25ea613ba9f6910ed356d88fda47ad29ff38c87914f78609c6
    summary: Setup sequence
    text:
      "## Setup sequence\n\n1. Initialize the workspace and record a baseline scan:\n\
      \n   ```bash\n   docledger init\n   docledger --json scan\n   ```\n\n2. Render\
      \ a bootstrap context that includes the unlinked source inventory and current\
      \ doc inventory:\n\n   ```bash\n   docledger docs build-context --bootstrap\n\
      \   ```\n\n   The bootstrap context file lists every source file that has no doc\
      \ record link. These are the sources that need documentation or explicit omission.\n\
      \n3. Create documentation files for those sources under a configured documentation\
      \ root (for example `docs/`).\n\n4. Generate deterministic proposal files and\
      \ review them before applying:\n\n   ```bash\n   docledger links propose --all-docs\n\
      \   docledger --json links import-map --directory <reviewed-proposals> --check-and-apply\n\
      \   ```\n\n5. Run a link audit and coverage review:\n\n   ```bash\n   docledger\
      \ --json links audit\n   docledger --json coverage\n   ```\n\n6. Validate the\
      \ documentation with the configured validation commands, then mark the new docs\
      \ fresh:\n\n   ```bash\n   docledger mark-fresh --all --reason \"Initial docs\
      \ after bootstrap link application.\"\n   ```\n\nFrom this point on, normal incremental\
      \ maintenance applies: subsequent scans mark a doc stale only when one of its\
      \ linked sources changes."
