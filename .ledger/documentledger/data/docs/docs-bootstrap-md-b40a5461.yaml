    summary: Why the first scan is a baseline
    text: "## Why the first scan is a baseline


      The first `docledger scan` hashes every configured source and documentation file
      and stores them as the baseline. Because there is no previous scan to compare
      against, it reports no changed, deleted, stale, or unlinked sources. Staleness
      and unlinked-source reporting only begin from the second scan onward."
    links: []
