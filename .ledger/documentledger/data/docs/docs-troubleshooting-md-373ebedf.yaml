  summary: '`sphinx-build` is not found'
  text: '## `sphinx-build` is not found


    `docs/build.sh` creates and activates `docs/venv/` and installs `docs/requirements.txt`,
    which provides `sphinx-build`. If the build cannot find `sphinx-build`, ensure
    the script reaches the `source "$VENV_DIR/bin/activate"` step and that `docs/requirements.txt`
    installs successfully (it requires network access on first run).'
  links: []
