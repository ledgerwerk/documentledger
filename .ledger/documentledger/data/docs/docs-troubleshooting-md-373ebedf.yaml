  summary: '`scan` fails with `storage_missing`'
  text: '## `scan` fails with `storage_missing`


    A command that requires an initialized workspace raises `storage_missing` when
    the config exists but storage metadata is absent. Resolve it the same way as the
    missing-storage `uninitialized` case: run `docledger init`.'
