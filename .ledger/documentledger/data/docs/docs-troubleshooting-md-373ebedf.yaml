  section_hash: ded4fea02b3c5fe3dec522fc954a48c70d9bcb19fe88707c33188fd31a693450
  summary: A changed source is reported as unlinked
  text: '## A changed source is reported as unlinked


    `unlinked_changed_sources` lists source files that changed since the last scan
    but have no doc record link. Decide for each one whether it needs documentation,
    then either add a link or leave it untracked. Use the bootstrap flag to surface
    all unlinked sources, not just changed ones:


    ```bash

    docledger docs build-context --bootstrap --out /tmp/docledger-bootstrap.md

    ```'
  links: []
