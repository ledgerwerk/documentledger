  summary: The Sphinx build warns about files inside the virtual environment
  text: '## The Sphinx build warns about files inside the virtual environment


    The documentation build creates a virtual environment under `docs/venv/`. `docs/conf.py`
    excludes `_build`, `venv`, and `.documentledger` from the Sphinx source scan.
    If you still see warnings from virtual-environment files, confirm `exclude_patterns`
    in `docs/conf.py` includes `venv` and `venv/**`, and remove any stale `docs/venv/`
    before rebuilding:


    ```bash

    rm -rf docs/venv docs/_build

    bash docs/build.sh

    ```'
  links: []
