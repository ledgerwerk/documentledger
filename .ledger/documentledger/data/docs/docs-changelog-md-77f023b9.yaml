    section_hash: 034a16be9cae78c70401d29602e9bf7f7b514e2d0aa30a718a8e2ca5a8ffaf4c
    summary: Changed
    text: "### Changed

      - Storage layer rewritten with atomic staged writes, source index separation,
      and ledgercore integration ([Architecture: Storage model](architecture.md#storage-model))

      - Read-only CLI commands no longer mutate storage metadata ([Architecture: Storage
      model](architecture.md#storage-model))

      - Scan schema bumped to v5 with separate source-index.json and SHA-256 hash verification
      ([Architecture: Scanning algorithm](architecture.md#scanning-algorithm))

      - Doc index parser now ignores headings inside fenced code blocks ([Architecture:
      Scanning algorithm](architecture.md#scanning-algorithm))

      - CLI pagination with cursor-based offset, and structured error for invalid cursors
      ([Usage: Link documentation to sources](usage.md#link-documentation-to-sources))

      - Reworked SKILL.md with entry protocol, bootstrap branch, incremental branch,
      and completion gate ([Bootstrap: Setup sequence](bootstrap.md#setup-sequence))

      - Added CommandState caching for scan, source index, and doc records to reduce
      redundant I/O ([Architecture: Scanning algorithm](architecture.md#scanning-algorithm))

      - Added test suites for build context selectors, CLI pagination, doc index, links
      batch, scan incremental, storage read-only, and workflow extras ([Usage: Link
      documentation to sources](usage.md#link-documentation-to-sources))

      - Updated conftest with JSON helpers and storage snapshot hashing ([Architecture:
      Scanning algorithm](architecture.md#scanning-algorithm))


