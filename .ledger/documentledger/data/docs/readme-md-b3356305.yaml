  section_hash: cad55aef7275e4db3967f0b739922b73e53e0cdea3f82b3902e491d9f865031e
  summary: Commands
  text: '## Commands


    | Command                                                                     |
    Purpose                                                                              |

    | ---------------------------------------------------------------------------
    | ------------------------------------------------------------------------------------
    |

    | `docledger init`                                                            |
    Create the canonical schema-3 shared layout and storage metadata.                    |

    | `docledger storage where` / `migrate` / `verify` / `cleanup-legacy`         |
    Inspect, migrate, verify, and explicitly clean up legacy storage.                    |

    | `docledger status`                                                          |
    Report workspace state, diagnostics, and the recommended next command.               |

    | `docledger doctor`                                                          |
    Validate storage schema, doc records, and link integrity.                            |

    | `docledger scan`                                                            |
    Record a new scan and compute changes.                                               |

    | `docledger sources list` / `show`                                           |
    Inspect source-unit ids for precise section links with compact filters and cursors.  |

    | `docledger links list` / `add-section` / `remove-section` / `import-map`    |
    Manage section-to-source-unit links and apply mapping batches atomically.            |

    | `docledger links propose`                                                   |
    Generate deterministic bootstrap mapping proposals without applying them.            |

    | `docledger links audit`                                                     |
    Check section links for missing sections, missing source units, and duplicate
    edges. |

    | `docledger docs list` / `sections` / `affected` / `stale` / `build-context`
    | Inspect docs and render bounded update context to a file.                            |

    | `docledger coverage`                                                        |
    Report doc/section/source coverage and obvious inventory gaps.                       |

    | `docledger mark-fresh`                                                      |
    Record that a section or doc matches the latest scan.                                |


    Pass `--json` before any command to emit a stable JSON envelope. Without `--json`,
    commands print human-readable output, and errors print concise `Error:` messages
    (use `--json` for machine-readable error envelopes).'
  links: []
