  section_hash: c24dd774b94795c488b3974d326c40e2dd6cefc33aa51584f2c4928f0143de68
  summary: State model
  text: '## State model


    Documentledger state is intentionally timestamp-free.


    - `.ledger/documentledger/data/storage.yaml` stores `schema_version`, `project_uuid`,
    `state_version`, and the latest compact scan summary counts used by `status`.

    - `.ledger/documentledger/data/scan.yaml` stores the current `documentledger.scan.v5`
    summary with source/doc hashes, source-index metadata, unit deltas, affected-section
    projections, stale-doc compatibility output, unmapped changed units, and monotonic
    scan `version`.

    - `.ledger/documentledger/data/source-index.json` stores the current deterministic
    source-unit inventory and is committed source of truth.

    - `.ledger/documentledger/data/docs/*.yaml` stores `documentledger.doc_record.v4`
    records with section links, tracked source-unit hashes, derived linked sources,
    freshness hashes, `last_fresh_scan_version`, notes, and integer `version` values.

    - Rendered contexts and proposals are derived output below the resolved cache
    `artifacts` mount.


    Freshness is hash-based only. Documentledger does not persist or compare legacy
    timestamp fields, `mtime`, or other date-based freshness markers.'
