  section_hash: f6e8ecab1d88312ce4be1a4cb637f192afa2e08609bcefb568583ccd531af614
  summary: Install
  text: '## Install


    ```bash

    pip install -e .

    ```


    This exposes the `docledger` console script. Documentledger requires Python 3.10
    or newer.


    > `ledgercore>=0.5.0,<0.6.0` is an active dependency. Documentledger uses its
    schema-3 shared manifest, derived paths, bindings, atomic writes, YAML storage,
    path validation, and SHA-256 helpers.'
  links: []
