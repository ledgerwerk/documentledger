  section_hash: 645779aa1e0395aa48c8d99086184ef3c1a50c8a188806753815ee39e3ec3e4a
  summary: Storage migration
  text: '## Storage migration


    Existing legacy workspaces are never migrated implicitly. Inspect and apply an
    explicit, copy-first plan:


    ```bash

    docledger storage where

    docledger storage migrate --dry-run --plan-file migration.json

    docledger storage migrate --plan-file migration.json --adopt-project-uuid

    docledger storage verify --strict

    docledger storage cleanup-legacy --dry-run

    ```


    Migration preserves the legacy config and data, verifies every copied regular
    file by SHA-256, updates the shared manifest last, and treats `source-index.json`
    as committed baseline state. Missing source indexes require explicit exact-hash
    repair; cleanup requires a completed migration journal and `--yes`.'
