  section_hash: 3719dc71007d3b2e13c5796a022ee0feed203250d4fe9a56fb5c95e5e4d23ed6
  summary: Canonical storage
  text: '## Canonical storage


    Documentledger uses ledgercore 0.5 schema 3 as the shared project authority. The
    committed manifest is `.ledger/ledger.toml`; the tool config is derived at `.ledger/documentledger/config.toml`;
    durable scan, source-index, and document-record state is in the `data` project
    mount; and rendered/proposal output is in the resolved cache `artifacts` mount.
    Ledgercore owns manifest TOML writing and schema-3 `.ledger-project.toml` binding
    markers.


    Legacy `.documentledger` layouts remain compatibility input only. Migration is
    explicit, copy-first, SHA-256 verified, and activates the shared manifest last.
    `source-index.json` is part of the committed baseline and may only be repaired
    when exact reconstruction matches the recorded hash.'
