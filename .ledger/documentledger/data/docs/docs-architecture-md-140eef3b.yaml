- section_id: md:section:docs/architecture.md::scanning-algorithm
  doc_path: docs/architecture.md
  heading_path:
  - Architecture
  - Scanning algorithm
  heading_slug: scanning-algorithm
  line_span:
  - 41
  - 58
  section_hash: a2be101d2a1769e4b0fb11e7f11d193a1cb34c1e60573354d118155798b79279
  summary: Scanning algorithm
  text: '## Scanning algorithm


    The scanner collects files under the configured source roots and documentation
    roots. It skips storage files, excluded directories such as `.git`, `__pycache__`,
    `build`, `dist`, virtual environments, and files whose extensions are not configured.
    Documentation files are parsed into stable sections from Markdown headings and
    optional `docledger-section` markers; files without headings still receive a whole-document
    section id.


    Each collected file is hashed with SHA-256. Python source files are also parsed
    into source units: a file fallback unit, a module unit, and any top-level functions,
    classes, and methods. Each source unit carries separate hashes for signatures,
    decorators, bodies, docstrings, public contract, and exact content. Public contract
    hashes include semantic details such as exported assignments and public literal
    values so section links can track meaningful API behavior instead of only raw
    file bytes.


    On the first scan, Documentledger records a clean baseline. On later scans it
    compares current source hashes and source-unit hashes with the previous scan:


    - Current paths with missing or different previous hashes become changed sources.

    - Previous source paths missing from the current set become deleted sources.

    - Changed or deleted source units are resolved through section links to produce
    affected sections.

    - `stale_docs` remains available as a compatibility projection of the docs that
    still contain affected sections.

    - Changed sources with no link record are reported as unlinked changed sources.

    - Changed units with no matching section link are reported as unmapped changed
    units.

    - If every source and documentation hash matches the previous scan, `.documentledger/scan.yaml`
    and `.documentledger/source-index.json` are not rewritten, no source ASTs are
    reparsed, the previous scan version is reused, and the result reports `unchanged`
    as true.


    <!-- docledger-section: architecture-link-management -->'
