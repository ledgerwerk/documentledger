  section_hash: ca774656330840a62395b75f14f3568aecec96c5f7fe9c733050d989290d5116
  summary: Link management
  text: '## Link management


    A document link is usually a section edge: one documentation section linked to
    one source unit plus a coverage type, impact type, reason, and tracked hash set.
    `links add-section` validates the doc, section, and source unit, then records
    tracked hashes based on the coverage defaults. `links import-map` validates full
    multi-file batches before writing and applies them as one logical operation so
    section replacement and versioning stay coherent.


    `links audit` checks stored section links for missing sections, missing source
    units, and duplicate edges. `links add` and `links remove` remain as broad-file
    fallback commands. They store whole-doc fallback links that track the file fallback
    unit, which is still useful for unparseable sources or intentionally coarse docs.


    <!-- docledger-section: architecture-context-rendering -->'
