  section_hash: 8ed1747c772d45785723b430fae4ead50671cd059dcfebecfa7f3e2dd50b76e3
  summary: Context rendering
  text: '## Context rendering


    `docs affected` computes a live affected-section projection from the latest scan
    and the current doc records. This means section-level `mark-fresh` can clear affectedness
    without requiring a follow-up scan.


    `docs build-context` renders a Markdown context document for distinct selector
    modes: `--affected`, `--all`, `--doc DOC [--section SECTION]`, or `--bootstrap`.
    The context is always written to a file; printing is explicit. Bounded output
    options limit source lines, section lines, and total bytes while surfacing a truncation
    manifest instead of silently dropping content.


    The `--include-unlinked` flag adds the full unlinked source inventory to non-bootstrap
    context modes. The bootstrap mode is intended for first-time documentation passes
    in repositories that do not yet have a link graph.


    <!-- docledger-section: architecture-freshness-marking -->'
