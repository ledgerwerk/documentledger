  heading_slug: freshness-marking
  line_span:
  - 77
  - 84
  section_hash: a9c4d43fa2dcfb8d9106401f67d3cd4f8b8151147d83bcf795b5ec5fc2cacc70
  summary: Freshness marking
  text: '## Freshness marking


    `mark-fresh` requires a latest scan and a non-empty reason. It can update one
    selected section, one selected doc, or all currently affected docs. For each selected
    section it stores the current section hash, refreshes the tracked source-unit
    hashes for that section''s links, updates the latest scan version and document
    hash, and records the reason in the document record.


    By default `mark-fresh` rejects documents that have no linked sources with an
    `unlinked_doc` error. This prevents tracking a document that can never become
    stale from source changes. The `--allow-unlinked` option overrides the check for
    intentionally unlinked documents and records the reason with an `(intentionally
    unlinked)` marker.


    <!-- docledger-section: architecture-cli-structure-and-errors -->'
  links: []
