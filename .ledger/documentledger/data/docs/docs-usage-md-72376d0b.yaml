    section_hash: c928480607e41ebb69ad4cae685e9cf2f01d6dc240b5426de7bcb2edf5b21375
    summary: Check workspace status
    text: "## Check workspace status


      ```bash

      docledger --json status

      ```


      Status reports the workspace `state`:


      - `uninitialized`: no `documentledger.toml` was found.

      - `bootstrap_required`: there is no baseline scan yet, or there is a baseline
      but no usable doc links.

      - `incremental_clean`: the latest scan has no affected linked sections.

      - `incremental_affected`: the latest scan has affected linked sections that should
      be reviewed.

      - `mapping_incomplete`: changed source files are not yet fully linked to documentation.


      The result also reports `recommended_command`, `recommended_reason`, compact latest-scan
      counts, and any root-layout diagnostics that should be fixed before trusting a
      baseline.


      <!-- docledger-section: usage-run-scan -->"
    links: []
