    section_hash: 964db75afc0640ef3adfb472ad80345b26926eb43523b0b8a55de741aba946fe
    summary: Ledger state and commit policy
    text: "## Ledger state and commit policy


      Documentledger stores its own state under the configured `.documentledger/` directory.
      The recommended commit policy for a documentation freshness ledger is:


      - Commit `.documentledger/storage.yaml`, `.documentledger/scan.yaml`, and `.documentledger/docs/*.yaml`.
      These are the source of truth for project identity, the current scan baseline,
      section-level links, tracked hash state, and freshness markers.

      - Ignore `.documentledger/rendered/`. Rendered context is regenerated on demand
      by `docs build-context`.


      Do not edit `.documentledger/` files directly; use the `docledger` commands so
      the records stay consistent."
