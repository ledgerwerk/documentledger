    summary: Inspect status and next action
    text: "## Inspect status and next action


      ```bash

      documentledger --json status

      documentledger --json doctor

      documentledger --json next-action

      ```


      `uninitialized` means no resolvable canonical project or its required metadata,
      not simply that a legacy root TOML file is absent. Diagnostics distinguish missing
      bindings, missing data, invalid configuration, and link/index problems.


      <!-- docledger-section: scan-source-and-documentation-files -->"
    links: []
