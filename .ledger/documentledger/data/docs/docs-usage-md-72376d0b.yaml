    section_hash: 70061c813b3df76689dc2205bafab4d645ba9161cdc7be36f883260bacb1951f
    summary: Storage commands
    text: "## Storage commands


      Use `docledger storage where` to inspect the active layout. Migrate a legacy workspace
      with a reviewed dry-run plan, then verify before any cleanup:


      ```bash

      docledger storage migrate --dry-run --plan-file migration.json

      docledger storage migrate --plan-file migration.json --adopt-project-uuid

      docledger storage verify --strict

      docledger storage cleanup-legacy --dry-run

      ```


      Routine commands never migrate automatically and read-only commands do not initialize
      cache directories or repair bindings."
