    summary: Scan
    text: "## Scan


      ```bash

      documentledger --json scan

      ```


      The first scan is a clean baseline. Later scans compare deterministic SHA-256
      file and source-unit hashes and report changed/deleted sources, affected sections,
      unlinked changed sources, and unmapped changed units. An unchanged scan reuses
      its version and does not rewrite state.


      <!-- docledger-section: inspect-document-and-source-inventory -->"
