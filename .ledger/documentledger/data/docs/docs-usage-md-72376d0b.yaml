    section_hash: 826baee721ca5db0f022a8ec40d30534220793793f8855863d8cb32ff6589b3e
    summary: JSON, human, and profile output
    text: "## JSON, human, and profile output


      Put `--json` before a command for the stable machine envelope. Omit it for concise
      human output. `--profile` adds deterministic operation events and durations to
      JSON output for diagnosis. `documentledger --version`, `commands`, and `help COMMAND_PATH...`
      work without a workspace.


      Commit canonical project metadata and durable `data` records according to the
      repository policy. Cache `artifacts` output is derived and normally ignored. Do
      not edit ledger records manually.


      <!-- docledger-section: ledger-state-and-commit-policy -->"
    links: []
