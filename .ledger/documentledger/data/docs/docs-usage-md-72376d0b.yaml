    section_hash: 15aa0be3f57839da09df5376eb4393af2e013f06985ff9830e22655320593a52
    summary: Add broad and precise links {#link-documentation-to-sources}
    text:
      "## Add broad and precise links {#link-documentation-to-sources}\n\nPrefer\
      \ section-to-source-unit edges:\n\n```bash\ndocumentledger link add-section \\\
      \n  --doc docs/usage.md \\\n  --section usage-scan \\\n  --source-unit py:function:documentledger/commands/root.py::scan\
      \ \\\n  --coverage cli-command \\\n  --impact behavior \\\n  --reason \"Documents\
      \ scan behavior.\"\n```\n\nUse `documentledger link add --doc DOC --source SOURCE`\
      \ only when a whole-file edge is intentionally broad. Review links with `documentledger\
      \ link list` and remove them with the matching remove command.\n\n<!-- docledger-section:\
      \ propose-import-and-audit-links -->"
