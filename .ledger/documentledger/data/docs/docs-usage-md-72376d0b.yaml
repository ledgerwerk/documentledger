    summary: Mark fresh
    text:
      "## Mark fresh\n\n```bash\ndocumentledger document mark-fresh \\\n  --doc\
      \ docs/usage.md \\\n  --section usage-scan \\\n  --reason \"Updated after scan\
      \ version VERSION.\"\n```\n\nMark fresh only after validation. Section-level marking\
      \ updates the live affected projection without requiring another scan. Unlinked\
      \ documents are rejected unless `--allow-unlinked` is explicitly appropriate.\n\
      \n<!-- docledger-section: json-and-human-output -->"
