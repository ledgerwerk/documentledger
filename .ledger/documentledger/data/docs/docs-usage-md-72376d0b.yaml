    summary: Build context, update, and validate
    text: "## Build context, update, and validate


      ```bash

      documentledger document affected

      documentledger document build-context --affected --out /tmp/documentledger-context.md

      ```


      Edit affected sections, run configured validation commands, and inspect the resulting
      links and errors. Context is bounded by source lines, section lines, and total
      bytes and includes a truncation manifest when limits apply.


      <!-- docledger-section: mark-documentation-fresh -->"
    links: []
