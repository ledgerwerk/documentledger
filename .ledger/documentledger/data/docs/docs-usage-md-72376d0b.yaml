    summary: Ledger state and commit policy
    text: "## Ledger state and commit policy


      Commit `.ledger/ledger.toml`, the tool configuration, and durable `data` records
      according to repository policy. Cache `artifacts` output is derived. Historical
      scan state is supplied by Git history, not a persisted scans directory.


      <!-- docledger-section: storage-commands -->"
