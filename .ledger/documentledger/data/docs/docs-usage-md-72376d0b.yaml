    summary: Initialize
    text: "## Initialize


      From the repository root, initialize the shared ledger layout:


      ```bash

      documentledger init --project-name example

      ```


      Initialization creates `.ledger/ledger.toml`, the Documentledger tool config,
      the project `data` mount, and the cache `artifacts` mount.


      <!-- docledger-section: check-workspace-status -->"
