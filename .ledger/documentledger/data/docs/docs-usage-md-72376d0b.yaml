    summary: Initialize a workspace
    text: "## Initialize a workspace


      Run initialization from the repository root:


      ```bash

      docledger init

      ```


      By default this creates `documentledger.toml` and a `.documentledger/` storage
      directory. Use `--project-name` to set the project name, `--documentledger-dir`
      to choose another storage path, or `--hidden-config` to create `.documentledger.toml`
      instead.


      <!-- docledger-section: usage-check-workspace-status -->"
