    summary: Bootstrapping a new repository
    text: "## Bootstrapping a new repository


      For a new project, run `documentledger init`, create the first baseline with `documentledger
      --json scan`, and follow the dedicated [bootstrap workflow](bootstrap.md).


      <!-- docledger-section: usage-limitations -->"
