config_version = 2

[ledger]
code = "dl"

[scan]
source_roots = ["documentledger", "tests"]
doc_roots = ["docs", "README.md"]
source_extensions = [".py"]
doc_extensions = [".md"]

[validation]
commands = ["python -m pytest -q", "python -m compileall -q documentledger tests", "bash docs/build.sh"]

[policy]
require_doc_frontmatter = false
