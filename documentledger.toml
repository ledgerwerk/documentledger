[ledger]
code = "dl"
name = "documentledger"

[project]
name = "documentledger"
uuid = "a22f34cd-76fb-4e88-9439-54a232ef48a8"

[storage]
documentledger_dir = ".documentledger"

[scan]
source_roots = ["documentledger", "tests"]
doc_roots = ["docs", "README.md"]
source_extensions = [".py"]
doc_extensions = [".md"]

[validation]
commands = [
  "python -m pytest -q",
  "python -m compileall -q documentledger tests",
  "bash docs/build.sh",
]

[policy]
require_doc_frontmatter = false
