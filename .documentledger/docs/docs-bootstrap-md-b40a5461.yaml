    section_hash: 8dee41786cbaaccc470077bfaa35dff1e11569acfe8925e505fcb08ce60747a6
    summary: Setup sequence
    text:
      "## Setup sequence\n\n1. Initialize the workspace and record a baseline scan:\n\
      \n   ```bash\n   docledger init\n   docledger --json scan\n   ```\n\n2. Render\
      \ a bootstrap context that includes the unlinked source inventory and current\
      \ doc inventory:\n\n   ```bash\n   docledger docs build-context --bootstrap --out\
      \ /tmp/docledger-bootstrap.md\n   ```\n\n   The bootstrap context file lists every\
      \ source file that has no doc record link. These are the sources that need documentation\
      \ or explicit omission.\n\n3. Create documentation files for those sources under\
      \ a configured documentation root (for example `docs/`).\n\n4. Generate deterministic\
      \ proposal files and review them before applying:\n\n   ```bash\n   docledger\
      \ links propose --all-docs --out-dir /tmp/docledger-maps\n   docledger --json\
      \ links import-map --directory /tmp/docledger-maps --check-and-apply\n   ```\n\
      \n5. Run a link audit and coverage review:\n\n   ```bash\n   docledger --json\
      \ links audit\n   docledger --json coverage\n   ```\n\n6. Validate the documentation\
      \ with the configured validation commands, then mark the new docs fresh:\n\n \
      \  ```bash\n   docledger mark-fresh --all --reason \"Initial docs after bootstrap\
      \ link application.\"\n   ```\n\nFrom this point on, normal incremental maintenance\
      \ applies: subsequent scans mark a doc stale only when one of its linked sources\
      \ changes."
