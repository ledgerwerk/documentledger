    summary: Bootstrapping a new repository
    text: "# Bootstrapping a new repository


      Documentledger computes staleness from explicit doc-to-source links. A freshly
      initialized repository has no links yet, so the first scan reports no stale docs
      even though no documentation exists. This page describes the recommended setup
      sequence for first-time documentation work."
