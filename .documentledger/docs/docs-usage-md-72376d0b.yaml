    summary: Link documentation to sources
    text:
      "## Link documentation to sources\n\n```bash\ndocledger links add --doc docs/usage.md\
      \ --source documentledger/cli.py --reason \"Documents CLI workflow.\"\n```\n\n\
      Whole-file links remain available as a broad fallback, but precise section links\
      \ are the default:\n\n```bash\ndocledger links add-section \\\n  --doc docs/usage.md\
      \ \\\n  --section usage-validate-ledger-state \\\n  --source-unit py:function:documentledger/cli.py::doctor\
      \ \\\n  --coverage cli-command \\\n  --impact behavior \\\n  --reason \"Documents\
      \ the doctor command.\"\n```\n\nLinks use repository-relative POSIX paths. Document\
      \ paths must have configured documentation extensions, source paths and source\
      \ units must exist, and coverage and impact values are validated. Keep links precise:\
      \ section-level links let small command changes affect only the doc sections that\
      \ actually describe them.\n\nList and remove links with:\n\n```bash\ndocledger\
      \ links list\ndocledger links remove --doc docs/usage.md --source documentledger/cli.py\n\
      docledger links remove-section --doc docs/usage.md --section usage-validate-ledger-state\
      \ --source-unit py:function:documentledger/cli.py::doctor\ndocledger links import-map\
      \ --file /tmp/documentledger-map.yaml --validate\ndocledger links import-map --file\
      \ /tmp/documentledger-map.yaml --apply\n```\n\n<!-- docledger-section: usage-find-and-update-stale-documentation\
      \ -->"
