    summary: JSON and human output
    text:
      "## JSON and human output\n\nPass `--json` before the command to emit a stable\
      \ JSON envelope:\n\n```json\n{ \"ok\": true, \"command\": \"status\", \"result\"\
      : {}, \"events\": [] }\n```\n\nErrors also use a JSON envelope when `--json` is\
      \ set, and the envelope preserves the real command name:\n\n```json\n{\n  \"ok\"\
      : false,\n  \"command\": \"scan\",\n  \"error\": {\n    \"code\": \"workspace_not_found\"\
      ,\n    \"message\": \"...\",\n    \"remediation\": []\n  },\n  \"events\": []\n\
      }\n```\n\nWithout `--json`, commands print human-readable output and errors print\
      \ concise `Error:` messages with remediation hints.\n\n<!-- docledger-section:\
      \ usage-ledger-state-and-commit-policy -->"
