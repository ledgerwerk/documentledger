    summary: Scan source and documentation files
    text: "## Scan source and documentation files


      ```bash

      docledger --json scan

      ```


      A scan collects files from the configured source and documentation roots, hashes
      them, indexes Python source units, and compares the current state to the previous
      scan. The first scan establishes a baseline and does not report changed, deleted,
      stale, or unlinked sources.


      Later scans report:


      - `unchanged`, `true` when the source and documentation hashes match the previous
      scan exactly. No scan state is rewritten, no source files are re-indexed, and
      the previous scan version is reused; the human output prints `No tracked file
      changes since scan version <version>` instead of `Recorded scan version <version>`.

      - `changed_sources`, source files whose hash changed or that are new since the
      previous scan.

      - `changed_units`, source units whose tracked semantic hashes changed. For Python
      this is usually the changed function, method, class, or module contract rather
      than the whole file.

      - `deleted_sources`, source files that were present in the previous scan and are
      now gone.

      - `affected_sections`, the documentation sections currently impacted by changed
      or deleted linked source units.

      - `stale_docs`, a compatibility projection of the docs that still contain affected
      sections.

      - `unlinked_changed_sources`, changed source files that do not have documentation
      links.


      <!-- docledger-section: usage-link-documentation-to-sources -->"
