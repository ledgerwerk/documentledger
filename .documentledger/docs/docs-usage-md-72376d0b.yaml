    summary: Find and update stale documentation
    text: "## Find and update stale documentation


      ```bash

      docledger --json docs affected

      docledger docs build-context --affected --print

      ```


      `docs affected` reports the live affected sections for the latest scan. After
      a section is updated and marked fresh, it disappears from `docs affected` immediately;
      a follow-up scan is optional confirmation, not the only way to clear affectedness.


      The rendered context contains only the affected doc sections, their linked changed
      source units, the current relevant source snippets, unlinked changed sources,
      and configured validation commands. Inspect the affected sections and linked changed
      source units first. Expand to whole files only when the changed unit cannot be
      understood in isolation.


      <!-- docledger-section: usage-bootstrapping-a-new-repository -->"
