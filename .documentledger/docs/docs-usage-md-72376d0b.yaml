    summary: Mark documentation fresh
    text: '## Mark documentation fresh


      After updating and validating an affected section, mark it fresh:


      ```bash

      docledger mark-fresh --doc docs/usage.md --section usage-validate-ledger-state
      --reason "Docs updated after scan version 2."

      ```


      `mark-fresh` records the latest scan version, the current document hash, the current
      section hash, and the tracked source-unit hashes for the selected links. It requires
      a non-empty reason. Use `--all` to mark every currently affected section from
      the latest scan, or `--doc` without `--section` to update all affected sections
      in one doc explicitly.


      Unlinked docs are rejected by default:


      ```bash

      docledger mark-fresh --doc docs/index.md --reason "Navigation page."        #
      rejected: unlinked_doc

      docledger mark-fresh --doc docs/index.md --allow-unlinked --reason "Navigation
      page."

      ```


      This prevents silently tracking a doc that can never become stale from source
      changes. Pass `--allow-unlinked` only for intentionally unlinked docs; the record
      stores the reason with an `(intentionally unlinked)` marker.


      <!-- docledger-section: usage-validate-ledger-state -->'
