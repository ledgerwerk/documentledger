    section_hash: ccfb62a0bf2eb95dd6e5439ea9470b4679b0742bda156b328945359afad59810
    summary: Bootstrapping a new repository
    text: "## Bootstrapping a new repository


      A fresh repository has no links yet, so the first scan reports no stale docs.
      To drive an initial documentation pass, use the explicit bootstrap flow:


      ```bash

      docledger init

      docledger --json scan

      docledger docs build-context --bootstrap --out /tmp/docledger-bootstrap.md

      docledger links propose --all-docs --out-dir /tmp/docledger-maps

      docledger --json links import-map --directory /tmp/docledger-maps --check-and-apply

      ```


      The bootstrap context lists every source file that has no linked documentation
      and the current doc inventory. Review or correct the generated proposal files,
      apply them as one validated batch, run `docledger --json links audit`, then validate
      and mark the docs fresh."
