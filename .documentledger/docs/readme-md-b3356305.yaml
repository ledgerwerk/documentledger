    section_hash: a49e44ae1ca347c8eb166f9786d1f51f40306f96dee754ea363c9a7eab34df85
    summary: State model
    text: "## State model


      Documentledger state is intentionally timestamp-free.


      - `.documentledger/storage.yaml` stores `schema_version`, `project_uuid`, `state_version`,
      and the latest compact scan summary counts used by `status`.

      - `.documentledger/scan.yaml` stores the current `documentledger.scan.v5` summary
      with source/doc hashes, source-index metadata, unit deltas, affected-section projections,
      stale-doc compatibility output, unmapped changed units, and monotonic scan `version`.

      - `.documentledger/source-index.json` stores the current deterministic source-unit
      inventory.

      - `.documentledger/docs/*.yaml` stores `documentledger.doc_record.v4` records
      with section links, tracked source-unit hashes, derived linked sources, freshness
      hashes, `last_fresh_scan_version`, notes, and integer `version` values.

      - `.documentledger/rendered/latest-context.md` is derived output and should stay
      ignored.


      Freshness is hash-based only. Documentledger does not persist or compare legacy
      timestamp fields, `mtime`, or other date-based freshness markers."
