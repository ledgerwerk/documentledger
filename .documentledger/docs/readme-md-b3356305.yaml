    section_hash: e9cd79c5a29cfc23d821e8bc2af5e2ce16cf14ba59dcb13bf3acff2b14cd28b3
    summary: Workflow
    text: '## Workflow


      1. **Initialize.** `docledger init` creates `documentledger.toml` and a `.documentledger/`
      storage directory.

      2. **Scan.** `docledger scan` hashes source and documentation files under the
      configured roots, indexes only changed Python source files, persists a compact
      `.documentledger/scan.yaml` summary plus `.documentledger/source-index.json`,
      and rewrites state only when source or doc hashes change. Unchanged scans reuse
      the latest scan version and report `unchanged`.

      3. **Link.** `docledger links add-section --doc DOC --section SECTION --source-unit
      SOURCE_UNIT` connects a documentation section to a source unit with coverage,
      impact, reason, and tracked hashes. `links add --doc DOC --source SOURCE` remains
      available as a broad-file fallback.

      4. **Bootstrap and batch-link.** `docledger docs build-context --bootstrap --out
      FILE`, `docledger links propose --all-docs --out-dir DIR`, and `docledger --json
      links import-map --directory DIR --check-and-apply` provide a deterministic bootstrap
      path for the first link graph.

      5. **Find affected sections.** `docledger docs affected` lists documentation sections
      whose linked source units changed or disappeared.

      6. **Build update context.** `docledger docs build-context --affected --out FILE`
      renders the affected sections, linked changed source units, source snippets, unlinked
      changed sources, and configured validation commands.

      7. **Update and validate.** Rewrite only the affected sections by default, then
      run the validation commands.

      8. **Mark fresh.** `docledger mark-fresh --doc DOC --section SECTION --reason
      "..."` refreshes tracked source-unit hashes and section hashes in a versioned
      doc record. Unlinked docs are rejected by default; pass `--allow-unlinked` only
      for intentionally unlinked docs.'
