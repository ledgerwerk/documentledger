    summary: Install
    text: "## Install


      ```bash

      pip install -e .

      ```


      This exposes the `docledger` console script. Documentledger requires Python 3.10
      or newer.


      > `ledgercore>=0.2` is an active dependency. Documentledger uses it for YAML storage,
      atomic writes, config discovery, path validation, scan/doc identity helpers, and
      SHA-256 hashing helpers."
