    summary: Documentledger
    text: "# Documentledger


      Documentledger is a documentation freshness ledger for coding-agent workflows.
      It records repository scans, maps documentation sections to source units, reports
      affected documentation when linked source units change or disappear, and renders
      update context that tells an agent exactly which sections to inspect and rewrite.


      It is designed to keep documentation honest: documentation sections are linked
      to the source units they describe, and a scan marks those sections affected when
      their tracked source units change."
