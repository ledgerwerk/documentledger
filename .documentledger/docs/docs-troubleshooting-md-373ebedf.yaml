    summary: Every change makes too many docs stale
    text: "## Every change makes too many docs stale


      If a small source change marks many docs stale, the link graph is too broad. Each
      document should be linked only to the source files it actually describes. Narrow
      the links:


      ```bash

      docledger links remove --doc docs/usage.md --source documentledger/models.py

      ```


      Broad links (for example linking every doc to every module) defeat the selective-update
      model. Keep links precise."
