    summary: "`status` reports `uninitialized`"
    text: "## `status` reports `uninitialized`


      An `uninitialized` result can mean there is no config yet, or that `documentledger.toml`
      exists but `.documentledger/storage.yaml` is missing. This happens when the storage
      directory was removed or never created. Re-run initialization from the project
      root:


      ```bash

      docledger init

      ```


      `init` refuses to run when a config already exists; remove the stale config first
      only if you intend to start over."
