    summary: "`mark-fresh` fails with `unlinked_doc`"
    text: '## `mark-fresh` fails with `unlinked_doc`


      `mark-fresh` rejects documents that have no linked sources by default, because
      an unlinked document can never become stale from source changes and would silently
      drift. Either add links first:


      ```bash

      docledger links add --doc docs/index.md --source documentledger/cli.py --reason
      "Navigation page maps to the CLI."

      ```


      or explicitly record the document as intentionally unlinked:


      ```bash

      docledger mark-fresh --doc docs/index.md --allow-unlinked --reason "Navigation
      page; intentionally unlinked."

      ```'
