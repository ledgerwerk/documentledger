    section_hash: 6c388c6ddc52705560fa1cbacaa0b92c1370088f0470484b15b9d56c81977865
    summary: Configuration and workspace loading
    text: "## Configuration and workspace loading


      Documentledger discovers `documentledger.toml` or `.documentledger.toml` by walking
      upward from the current directory. The loaded configuration defines the project
      metadata, storage directory, scan roots, allowed file extensions, validation commands,
      and policy flags.


      A workspace combines the loaded configuration with storage metadata from `.documentledger/storage.yaml`.
      Commands that require an initialized workspace fail with a structured `workspace_not_found`
      error when no config is found, or a `storage_missing` error when the config exists
      but storage metadata is absent. `status` classifies the workspace operationally
      (`uninitialized`, `bootstrap_required`, `incremental_clean`, `incremental_affected`,
      or `mapping_incomplete`) and reports a recommended next command.


      Workspace loading is read-only. It validates the current storage schema and metadata,
      but it does not rewrite scan or doc records as a side effect of read-only commands.


      <!-- docledger-section: architecture-storage-model -->"
