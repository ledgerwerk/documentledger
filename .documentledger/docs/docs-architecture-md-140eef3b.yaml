    summary: Storage model
    text: "## Storage model


      The storage layer writes YAML files only through the Documentledger APIs:


      - `.documentledger/storage.yaml` stores schema metadata, project UUID, the current
      `state_version`, and compact latest-scan counts used by `status`.

      - `.documentledger/scan.yaml` stores the current source hashes, document hashes,
      source-index metadata, unit deltas, affected-section snapshots, stale-doc projections,
      unlinked changed sources, unmapped changed units, and the monotonic current scan
      `version`.

      - `.documentledger/source-index.json` stores the current source-unit inventory
      as deterministic compact JSON.

      - `.documentledger/docs/*.yaml` stores document records with `sections[].links[]`,
      derived `linked_sources`, section hashes, tracked source-unit hashes, freshness
      metadata including `last_fresh_scan_version`, notes, and a doc-record `version`.

      - `.documentledger/rendered/latest-context.md` is a regenerated cache of the latest
      rendered update context.


      Git history is the record of older scan baselines. `.documentledger/scans/` does
      not exist in the v5 storage model.


      The recommended commit policy is to version `storage.yaml`, `scan.yaml`, and `docs/*.yaml`
      as the source of truth, and to ignore `rendered/` because it is regenerated on
      demand.


      State is hash- and version-based. Timestamps are intentionally absent from persisted
      storage and rendered context front matter.


      <!-- docledger-section: architecture-path-identity -->"
