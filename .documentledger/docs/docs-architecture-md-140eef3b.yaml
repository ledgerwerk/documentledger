    section_hash: 531e5df61a3de2da232a3de46eb31ad0eedc562087b03b9560f8e9550cb63bc2
    summary: CLI structure and errors
    text: "## CLI structure and errors


      The Typer CLI exposes top-level commands for initialization, status, doctor checks,
      scans, and freshness marking. Nested command groups handle links, docs, and source-unit
      inspection.


      Error handling is centralized through a per-command error decorator. Each command
      callback is wrapped so that a `DocumentledgerError` is rendered with the real
      command name. With `--json`, the CLI emits a stable envelope with `ok`, `command`,
      `error` (code, message, remediation), and `events`. Without `--json`, it prints
      a concise human-readable `Error:` message and remediation hints. `DocumentledgerError`
      is a plain exception rather than a Click exception, which keeps command names
      accurate and lets the CLI choose the output format."
