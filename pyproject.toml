[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "documentledger"
dynamic = ["version"]
description = "Documentation freshness ledger for coding-agent workflows"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Documentledger Contributors" },
]
keywords = ["documentation", "freshness", "ledger", "coding-agent", "docs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "typer",
    "click",
    # Active dependency: ledgercore provides shared storage, identity, and hashing helpers.
    "ledgercore>=0.6.0,<0.7.0",
    "PyYAML",
    'tomli; python_version < "3.11"',
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "myst-parser>=2.0.0",
]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
]
test = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/documentledger/documentledger"
Repository = "https://github.com/documentledger/documentledger"
Documentation = "https://documentledger.readthedocs.io/"
Changelog = "https://github.com/documentledger/documentledger/blob/main/CHANGELOG.md"
Issues = "https://github.com/documentledger/documentledger/issues"

[project.scripts]
documentledger = "documentledger.launcher:main"
docledger = "documentledger.launcher:legacy_main"

[tool.setuptools_scm]
write_to = "documentledger/_version.py"

[tool.setuptools.packages.find]
include = ["documentledger*"]

[tool.setuptools.package-data]
documentledger = ["py.typed"]
